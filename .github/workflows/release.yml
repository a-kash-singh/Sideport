name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkgconf
      - run: scripts/package.sh
      - run: gh release create "$GITHUB_REF_NAME" build/Sideport-arm64.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
